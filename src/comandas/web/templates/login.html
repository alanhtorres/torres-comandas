<!DOCTYPE html>
<html lang="pt-BR" data-tema="{{ tema }}">
<head>
  <meta charset="utf-8">
  <title>Entrar — {{ loja }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='comum.css') }}">
  <script>/* tema escolhido neste aparelho (botão ☀️/🌙) vale mais que o padrão */try{var t=localStorage.getItem("tema");if(t==="claro"||t==="escuro")document.documentElement.dataset.tema=t}catch(e){}</script>
  <style>
    main { max-width: 360px; margin: 10vh auto; padding: 0 16px; }
    h1 { text-align: center; margin: 0 0 4px; }
    p.sub { text-align: center; color: var(--texto-2); margin: 0 0 12px; }
    input { font-size: 1.15rem; }
    button { width: 100%; margin-top: 16px; }
    .erro { color: #fecaca; background: #450a0a; border-radius: 8px; padding: 8px 10px; }
    .aviso-saida { color: #fde68a; background: #422006; border-radius: 8px; padding: 8px 10px; }
    :root[data-tema="claro"] .erro { color: #991b1b; background: #fee2e2; }
    :root[data-tema="claro"] .aviso-saida { color: #78350f; background: #fef3c7; }
  </style>
</head>
<body>
  <main class="cartao">
    <h1>{{ loja }}</h1>
    <p class="sub">Acesso da equipe</p>
    {% if aviso and not erro %}<p class="aviso-saida">{{ aviso }}</p>{% endif %}
    <form method="post">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" autofocus required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
      <button class="primario grande" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
