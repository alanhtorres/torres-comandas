<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Entrar — {{ loja }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='comum.css') }}">
  <style>
    main { max-width: 340px; margin: 12vh auto; padding: 0 16px; text-align: center; }
    input { font-size: 1.6rem; text-align: center; letter-spacing: 0.4em; margin: 12px 0; }
    button { width: 100%; }
    .erro { color: #fca5a5; }
  </style>
</head>
<body>
  <main class="cartao">
    <h1>{{ loja }}</h1>
    <p style="color: var(--texto-2)">Acesso da equipe — digite o PIN</p>
    <form method="post">
      <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus required>
      {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
      <button class="primario grande" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
