<!DOCTYPE html>
<html lang="pt-BR" data-tema="{{ tema }}">
<head>
  <meta charset="utf-8">
  <title>Primeiro acesso — Torres Comandas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='comum.css') }}">
  <script>/* tema escolhido neste aparelho (botão ☀️/🌙) vale mais que o padrão */try{var t=localStorage.getItem("tema");if(t==="claro"||t==="escuro")document.documentElement.dataset.tema=t}catch(e){}</script>
  <style>
    main { max-width: 420px; margin: 6vh auto; padding: 0 16px; }
    h1 { margin: 0 0 6px; }
    p { color: var(--texto-2); margin: 0 0 8px; }
    button { width: 100%; margin-top: 18px; }
    .erro { color: #fecaca; background: #450a0a; border-radius: 8px; padding: 8px 10px; }
  </style>
</head>
<body>
  <main class="cartao">
    <h1>Bem-vindo ao Torres Comandas</h1>
    <p>Crie o usuário <strong>administrador</strong> — o dono ou gerente. Ele tem acesso a tudo e é quem cria os outros
      usuários e define o que cada um pode fazer.</p>
    <form method="post">
      <label for="nome">Seu nome</label>
      <input id="nome" name="nome" required maxlength="60" autofocus>
      <label for="usuario">Usuário (para entrar no sistema, sem espaços)</label>
      <input id="usuario" name="usuario" required maxlength="30" autocapitalize="none" pattern="\S+" placeholder="ex.: maria">
      <label for="senha">Senha (mínimo 4 caracteres)</label>
      <input id="senha" name="senha" type="password" required minlength="4" autocomplete="new-password">
      <label for="confirmar">Repita a senha</label>
      <input id="confirmar" name="confirmar" type="password" required minlength="4" autocomplete="new-password">
      {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
      <button class="primario grande" type="submit">Criar administrador e entrar</button>
    </form>
  </main>
</body>
</html>
