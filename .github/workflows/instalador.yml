# Gera o instalador do Windows num Windows da nuvem do GitHub, testa o
# programa empacotado e o instalador de verdade, e — quando é uma versão
# (tag v1.2.3) — publica o TorresComandas-Setup-x.y.z.exe na página Releases.
name: Instalador Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes automatizados (no Windows)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Inno Setup
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Gerar executável e instalador
        run: .\build_tools\build_windows.ps1

      - name: Testar o executável empacotado
        run: .\build_tools\testar_exe.ps1 -Exe "dist\TorresComandas\TorresComandas.exe" -Porta 8099

      - name: Testar o instalador (instala, roda e desinstala)
        run: |
          $setup = Get-ChildItem installer\Output\TorresComandas-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=""""", "/LOG=$env:RUNNER_TEMP\setup.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "Instalador saiu com código $($p.ExitCode)" }
          $exe = "$env:ProgramFiles\Torres Comandas\TorresComandas.exe"
          if (-not (Test-Path $exe)) { throw "Programa não foi instalado em $exe" }
          $regra = netsh advfirewall firewall show rule name="Torres Comandas"
          if ($LASTEXITCODE -ne 0) { throw "Regra do firewall não foi criada" }
          .\build_tools\testar_exe.ps1 -Exe $exe -Porta 8098
          $p = Start-Process "$env:ProgramFiles\Torres Comandas\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -PassThru -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Desinstalação não removeu o programa" }

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: installer/Output/*.exe

      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem installer\Output\TorresComandas-Setup-*.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $setup.FullName --title "Torres Comandas ${{ github.ref_name }}" --notes "Baixe o TorresComandas-Setup e dê dois cliques para instalar. Instruções completas no README."
